<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>Rotation metadata can change in a running stream</title>
  <script src="/tests/SimpleTest/SimpleTest.js"></script>
  <script type="text/javascript" src="mediasource.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css" />
</head>
<body>
<pre id="test">
<script class="testbody" type="text/javascript">

"use strict";

addMSEPrefs(
  ["media.cloneElementVisually.testing", true],
  ["media.dormant-on-pause-timeout-ms", -1]
);

const SEGMENT_DURATION = 0.6;
const PORTRAIT = [240, 320];
const LANDSCAPE = [320, 240];

function rotationEvent(target, name, signal) {
  return new Promise((resolve, reject) => {
    const cleanup = () => {
      target.removeEventListener(name, onEvent);
      target.removeEventListener("error", onError);
      target.removeEventListener("abort", onError);
      signal.removeEventListener("abort", onAbort);
    };
    const onEvent = event => {
      cleanup();
      resolve(event);
    };
    const onError = event => {
      cleanup();
      reject(new Error(`${target.constructor.name}: ${event.type} while waiting for ${name}`));
    };
    const onAbort = () => {
      cleanup();
      reject(signal.reason);
    };
    if (signal.aborted) {
      reject(signal.reason);
      return;
    }
    target.addEventListener(name, onEvent);
    target.addEventListener("error", onError);
    target.addEventListener("abort", onError);
    signal.addEventListener("abort", onAbort);
  });
}

const rotationCases = {
  representationChange: {
    representations: ["portrait", "landscape-rot90", "portrait"],
    playbackSizes: [PORTRAIT],
  },
  initiallyRotated: {
    representations: ["landscape-rot90", "portrait", "landscape-rot90"],
    playbackSizes: [PORTRAIT],
    seeks: [[0.9, PORTRAIT], [0.3, PORTRAIT], [1.5, PORTRAIT], [0, PORTRAIT]],
  },
  rotationAndRepresentationChange: {
    representations: ["landscape-rot90", "landscape", "portrait"],
    playbackSizes: [PORTRAIT, LANDSCAPE, PORTRAIT],
    seeks: [[0.9, LANDSCAPE], [1.5, PORTRAIT], [0.3, PORTRAIT], [0.9, LANDSCAPE], [0, PORTRAIT]],
  },
  rotationOnly: {
    representations: ["landscape", "landscape-rot90", "landscape"],
    playbackSizes: [LANDSCAPE, PORTRAIT, LANDSCAPE],
    seeks: [[0.9, PORTRAIT], [1.5, LANDSCAPE], [0.3, LANDSCAPE], [0.9, PORTRAIT], [0, LANDSCAPE]],
  },
};

function expectResizeEvents({ representations, playbackSizes, seeks = [] }, cloneVideo = false) {
  return runWithMSE(async (ms, video) => {
    const controller = new AbortController();
    const { signal } = controller;
    const resizeEvents = [];
    let clone;
    video.addEventListener("error", () => {
      controller.abort(new Error(`Video error: ${video.error?.message}`));
    }, { signal });
    video.addEventListener("resize", () => {
      resizeEvents.push([video.videoWidth, video.videoHeight]);
    }, { signal });

    const checkDimensions = (expected, label) => {
      isDeeply([video.videoWidth, video.videoHeight], expected, label);
      if (clone) {
        isDeeply([clone.videoWidth, clone.videoHeight], expected, `${label}: visual clone`);
      }
    };

    const clonePausedFrame = async () => {
      ok(video.paused, "Attach a visual clone while the source is paused");
      if (clone) {
        SpecialPowers.wrap(video).stopCloningElementVisually();
        clone.remove();
      }
      clone = document.createElement("video");
      document.body.appendChild(clone);
      await SpecialPowers.wrap(video).cloneElementVisually(clone);
    };

    try {
      await rotationEvent(ms, "sourceopen", signal);
      const sb = ms.addSourceBuffer("video/mp4");
      const segments = representations.flatMap((name, index) => [
        `rotation/${name}-init.mp4`,
        `rotation/${name}-${index + 1}.m4s`,
      ]);
      const buffers = await Promise.all(segments.map(async segment => {
        const response = await fetch(segment, { signal });
        if (!response.ok) {
          throw new Error(`${segment}: HTTP ${response.status}`);
        }
        return response.arrayBuffer();
      }));
      for (const buffer of buffers) {
        await Promise.all([
          rotationEvent(sb, "updateend", signal),
          Promise.resolve().then(() => sb.appendBuffer(buffer)),
        ]);
      }
      ms.endOfStream();

      if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
        await rotationEvent(video, "loadeddata", signal);
      }
      if (cloneVideo) {
        await clonePausedFrame();
      }
      checkDimensions(playbackSizes[0], "Dimensions of the first paused frame");
      await Promise.all([
        rotationEvent(video, "ended", signal),
        video.play(),
      ]);
      isfuzzy(video.duration, representations.length * SEGMENT_DURATION, 0.001,
              "Playback spans all three complete segments");
      checkDimensions(playbackSizes.at(-1), "Dimensions at the end of forward playback");
      isDeeply(resizeEvents, playbackSizes, "Forward playback resize history");

      video.pause();
      const expectedSizes = [...playbackSizes];
      for (const [index, [time, size]] of seeks.entries()) {
        await Promise.all([
          rotationEvent(video, "seeked", signal),
          Promise.resolve().then(() => { video.currentTime = time; }),
        ]);
        await new Promise(requestAnimationFrame);
        await new Promise(requestAnimationFrame);
        ok(video.paused, `Seeking to ${time} leaves playback paused`);
        checkDimensions(size, `Dimensions after paused seek to ${time}`);
        if (cloneVideo && index === 0) {
          await clonePausedFrame();
          checkDimensions(size, "Dimensions after replacing the paused visual clone");
        }
        if (size.some((dimension, index) => dimension !== expectedSizes.at(-1)[index])) {
          expectedSizes.push(size);
        }
      }
      isDeeply(resizeEvents, expectedSizes, "Playback and paused-seek resize history");
    } finally {
      if (clone) {
        SpecialPowers.wrap(video).stopCloningElementVisually();
        clone.remove();
      }
      controller.abort(new Error("Rotation test finished"));
      URL.revokeObjectURL(video.src);
      video.removeAttribute("src");
      video.load();
      video.remove();
    }
  });
}

add_task(async function testChangeStreamRotationNoSizeChange() {
  await expectResizeEvents(rotationCases.representationChange);
  await expectResizeEvents(rotationCases.initiallyRotated);
});

add_task(async function testChangeStreamRotationWithSizeChange() {
  for (const testCase of [rotationCases.rotationAndRepresentationChange, rotationCases.rotationOnly]) {
    await expectResizeEvents({ ...testCase, seeks: [] });
    await expectResizeEvents(testCase);
  }
});

add_task(async function testInitiallyRotatedVisualClone() {
  await expectResizeEvents(rotationCases.initiallyRotated, true);
});

add_task(async function testRepresentationChangeWithVisualClone() {
  await expectResizeEvents({
    ...rotationCases.representationChange,
    seeks: [[0.9, PORTRAIT], [0.3, PORTRAIT], [1.5, PORTRAIT]],
  }, true);
});

add_task(async function testRotationOnlyWithVisualClone() {
  await expectResizeEvents(rotationCases.rotationOnly, true);
});

</script>
</pre>
</body>
</html>
